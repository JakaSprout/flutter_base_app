flutter_launcher_icons:
  # Production flavor icon configuration
  image_path: "assets/icons/app_icon.png"

  # Android configuration
  android: true
  min_sdk_android: 24  # Android 7.0 (Nougat) - matches build.gradle.kts
  # Adaptive icon configuration (Android 8.0+)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

  # iOS configuration
  ios: true
  remove_alpha_ios: true  # Remove alpha channel for iOS (required)
  background_color_ios: "#FFFFFF"  # Background color for iOS icon

