flutter_launcher_icons:
  # Main app icon (1024x1024 recommended)
  # Place your icon at: assets/icons/app_icon.png
  image_path: "assets/icons/app_icon.png"

  # Android configuration
  android: true
  # Android adaptive icon (optional, for Android 8.0+)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

  # iOS configuration
  ios: true
  # Remove alpha channel for iOS (recommended)
  remove_alpha_ios: true

  # Flavor-specific icons (optional)
  # Uncomment and configure if you want different icons per flavor
  # flavors:
  #   dev:
  #     image_path: "assets/icons/app_icon_dev.png"
  #     android: true
  #     ios: true
  #   staging:
  #     image_path: "assets/icons/app_icon_staging.png"
  #     android: true
  #     ios: true
  #   prod:
  #     image_path: "assets/icons/app_icon.png"
  #     android: true
  #     ios: true
